name: Customer Bug Report
description: Report a bug , unexpected problem or behavior
title: "[Bug]: "
type: 'Bug'
projects: ["enabletechnologies/13"]
assignees:
  - p2-enable
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: Shell
  - type: textarea
    id: testcases
    attributes:
      label: Test Cases
      description: Share some test cases
      placeholder: Share some test cases!
      value: "Please test me!"
    validations:
      required: true      
  - type: textarea
    id: environment
    attributes:
      label: Environment details 
      description: Please provide the environment details.
      placeholder: Where do you see this bug!
      value: "qa"
    validations:
      required: true